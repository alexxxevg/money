name: Validate Money PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate scripts and business logic
        run: |
          node --check server.js
          node --check dist/app.js
          node --check dist/auth.js
          node --check dist/sw.js
          node --test model.test.js security.test.js sync.test.js
